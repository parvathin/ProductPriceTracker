<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Price Tracker</title>
    <!-- Bootstrap CSS (via CDN) -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container my-4">
        <h1 class="mb-4">Product Price Tracker</h1>
        <!-- Product Selection and Alert Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="alertForm">
                    <div class="form-group">
                        <label for="productSelect">Select Product</label>
                        <select class="form-control" id="productSelect" required>
                            <option value="">Loading products...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="desiredPrice">Desired Price ($)</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               id="desiredPrice"
                               placeholder="Enter your target price"
                               required />
                    </div>
                    <button type="submit" class="btn btn-primary">Set Alert</button>
                </form>
                <div id="formMessage" class="mt-3"></div>
            </div>
        </div>

        <!-- Active Alerts Section -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Active Alerts</h5>
                <ul id="alertsList" class="list-group">
                </ul>
            </div>
        </div>

        <!-- Notification Area -->
        <div id="notification" class="alert alert-success mt-4 d-none" role="alert">
            <!-- Notification message will be shown here -->
        </div>
    </div>

    <!-- Script files-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
